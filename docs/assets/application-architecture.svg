<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" role="img" aria-labelledby="title desc">
<title id="title">Current application architecture</title><desc id="desc">Local players use a browser React app with App, screens, Game, Board and Cell components and state held in memory.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#24364b"/></linearGradient></defs><rect width="940" height="430" rx="24" fill="url(#bg)"/>
<g font-family="Inter,Arial" text-anchor="middle"><rect x="340" y="30" width="260" height="62" rx="14" fill="#0e7490"/><text x="470" y="68" fill="#fff" font-size="19" font-weight="700">Local players</text><path d="M470 92v32" stroke="#61dafb" stroke-width="3"/><rect x="285" y="124" width="370" height="68" rx="14" fill="#26384f" stroke="#61dafb" stroke-width="2"/><text x="470" y="153" fill="#f8fafc" font-size="20" font-weight="700">Browser · React application</text><text x="470" y="176" fill="#b8c8d8" font-size="13">State remains in browser memory</text><path d="M470 192v30M200 222h540M200 222v28M470 222v28M740 222v28" stroke="#61dafb" stroke-width="2" fill="none"/>
<rect x="90" y="250" width="220" height="72" rx="12" fill="#33465f"/><text x="200" y="281" fill="#fff" font-size="17" font-weight="700">App / screen flow</text><text x="200" y="302" fill="#b8c8d8" font-size="12">Title · setup · theme</text><rect x="360" y="250" width="220" height="72" rx="12" fill="#33465f"/><text x="470" y="281" fill="#fff" font-size="17" font-weight="700">Game</text><text x="470" y="302" fill="#b8c8d8" font-size="12">Moves · turns · cascade</text><rect x="630" y="250" width="220" height="72" rx="12" fill="#33465f"/><text x="740" y="281" fill="#fff" font-size="17" font-weight="700">Presentation</text><text x="740" y="302" fill="#b8c8d8" font-size="12">Board · Cell · orb effects</text><path d="M470 322v34" stroke="#61dafb" stroke-width="2"/><rect x="320" y="356" width="300" height="48" rx="12" fill="#155e75"/><text x="470" y="385" fill="#fff" font-size="16" font-weight="700">No API · no database · no online server</text></g></svg>