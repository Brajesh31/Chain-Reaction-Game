<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
<title id="title">Release pipeline</title><desc id="desc">Changes are merged, dependencies installed, tests run, production build created, static bundle deployed and smoke tested.</desc>
<rect width="1000" height="260" rx="24" fill="#111c2c"/><g font-family="Inter,Arial" text-anchor="middle"><g fill="#26384f" stroke="#61dafb"><rect x="25" y="75" width="145" height="90" rx="14"/><rect x="210" y="75" width="145" height="90" rx="14"/><rect x="395" y="75" width="145" height="90" rx="14"/><rect x="580" y="75" width="145" height="90" rx="14"/><rect x="765" y="75" width="210" height="90" rx="14"/></g><g fill="#fff" font-size="16" font-weight="700"><text x="97" y="112">Merge</text><text x="282" y="112">Install</text><text x="467" y="112">Test</text><text x="652" y="112">Build</text><text x="870" y="112">Deploy + smoke</text></g><g fill="#a8bbd0" font-size="12"><text x="97" y="137">Reviewed change</text><text x="282" y="137">npm ci</text><text x="467" y="137">Jest + docs</text><text x="652" y="137">build/ artifact</text><text x="870" y="137">Static host</text></g><g stroke="#61dafb" stroke-width="3" fill="none"><path d="M170 120h40m-9-9 9 9-9 9M355 120h40m-9-9 9 9-9 9M540 120h40m-9-9 9 9-9 9M725 120h40m-9-9 9 9-9 9"/></g></g><text x="500" y="215" text-anchor="middle" font-family="Inter,Arial" font-size="13" fill="#94a3b8">Failed checks block release; failed smoke tests trigger rollback.</text></svg>