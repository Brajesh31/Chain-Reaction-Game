<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">Cascade resolution diagram</title><desc id="desc">Four stages showing a selected cell, burst, orthogonal distribution and follow-up chain reaction.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#24364b"/></linearGradient></defs><rect width="1000" height="330" rx="24" fill="url(#bg)"/>
<g font-family="Inter,Arial" text-anchor="middle"><g transform="translate(40 60)"><rect width="190" height="190" rx="18" fill="#1d2a3c" stroke="#50647d"/><rect x="70" y="65" width="50" height="50" rx="12" fill="#3b4b62"/><circle cx="85" cy="82" r="10" fill="#fb5964"/><circle cx="105" cy="98" r="10" fill="#fb5964"/><text x="95" y="145" fill="#f8fafc" font-size="17" font-weight="700">1. Place orb</text><text x="95" y="170" fill="#a8bbd0" font-size="12">Reach critical mass</text></g><path d="M240 155h35m-9-9 9 9-9 9" stroke="#61dafb" stroke-width="3" fill="none"/>
<g transform="translate(285 60)"><rect width="190" height="190" rx="18" fill="#1d2a3c" stroke="#50647d"/><circle cx="95" cy="88" r="32" fill="none" stroke="#61dafb" stroke-width="5"/><circle cx="95" cy="88" r="15" fill="#fb5964"/><path d="M95 38v-14M145 88h14M95 138v14M45 88H31" stroke="#61dafb" stroke-width="4" stroke-linecap="round"/><text x="95" y="145" fill="#f8fafc" font-size="17" font-weight="700">2. Burst</text><text x="95" y="170" fill="#a8bbd0" font-size="12">Source cell releases</text></g><path d="M485 155h35m-9-9 9 9-9 9" stroke="#61dafb" stroke-width="3" fill="none"/>
<g transform="translate(530 60)"><rect width="190" height="190" rx="18" fill="#1d2a3c" stroke="#50647d"/><g fill="#fb5964"><circle cx="95" cy="40" r="10"/><circle cx="95" cy="88" r="10"/><circle cx="95" cy="136" r="10"/><circle cx="47" cy="88" r="10"/><circle cx="143" cy="88" r="10"/></g><text x="95" y="145" fill="#f8fafc" font-size="17" font-weight="700">3. Distribute</text><text x="95" y="170" fill="#a8bbd0" font-size="12">Up, down, left, right</text></g><path d="M730 155h35m-9-9 9 9-9 9" stroke="#61dafb" stroke-width="3" fill="none"/>
<g transform="translate(775 60)"><rect width="190" height="190" rx="18" fill="#1d2a3c" stroke="#50647d"/><circle cx="95" cy="88" r="32" fill="none" stroke="#61dafb" stroke-width="5"/><circle cx="95" cy="88" r="14" fill="#4c9eff"/><path d="M125 64l13-13M139 102l18 4" stroke="#fb5964" stroke-width="4" stroke-linecap="round"/><text x="95" y="145" fill="#f8fafc" font-size="17" font-weight="700">4. Chain again</text><text x="95" y="170" fill="#a8bbd0" font-size="12">Process until stable</text></g></g></svg>