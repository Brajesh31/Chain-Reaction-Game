<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
<title id="title">Chain Reaction board illustration</title><desc id="desc">A stylized six by six board with red and blue orbs and a highlighted cascade cell.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#253449"/></linearGradient><linearGradient id="cell" x2="0" y2="1"><stop stop-color="#34465d"/><stop offset="1" stop-color="#1f2c3e"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="64" height="48" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="56" height="40" rx="9" fill="url(#cell)" stroke="#5b6d83"/></pattern></defs>
<rect width="920" height="480" rx="28" fill="url(#bg)"/><text x="64" y="68" fill="#f8fafc" font-family="Inter,Arial" font-size="30" font-weight="700">CHAIN REACTION</text><text x="66" y="98" fill="#94a3b8" font-family="Inter,Arial" font-size="15">A move can change the entire board.</text>
<g transform="translate(260 118)"><rect x="-18" y="-18" width="420" height="320" rx="22" fill="#0b1220" stroke="#53657a" stroke-width="2"/><rect width="376" height="288" fill="url(#grid)"/>
<g fill="#fb5964" stroke="#ffd2d5" stroke-width="2"><circle cx="28" cy="20" r="10"/><circle cx="41" cy="20" r="10"/><circle cx="92" cy="68" r="10"/><circle cx="105" cy="68" r="10"/></g>
<g fill="#4c9eff" stroke="#cbe4ff" stroke-width="2"><circle cx="220" cy="68" r="10"/><circle cx="233" cy="68" r="10"/><circle cx="284" cy="164" r="10"/><circle cx="297" cy="164" r="10"/><circle cx="310" cy="164" r="10"/></g>
<circle cx="156" cy="116" r="30" fill="none" stroke="#61dafb" stroke-width="4" filter="url(#glow)"/><circle cx="156" cy="116" r="12" fill="#fb5964"/><path d="M156 82V65M190 116h18M156 150v18M122 116h-18" stroke="#61dafb" stroke-width="3" stroke-linecap="round"/><text x="0" y="300" fill="#e2e8f0" font-family="Inter,Arial" font-size="12">6 × 6 illustrative grid</text></g>
<g transform="translate(700 170)" font-family="Inter,Arial"><circle cx="12" cy="12" r="9" fill="#fb5964"/><text x="32" y="17" fill="#f8fafc" font-size="16">Player 1</text><circle cx="12" cy="52" r="9" fill="#4c9eff"/><text x="32" y="57" fill="#f8fafc" font-size="16">Player 2</text><circle cx="12" cy="92" r="9" fill="#8bc34a"/><text x="32" y="97" fill="#f8fafc" font-size="16">Player 3</text><circle cx="12" cy="132" r="9" fill="#facc15"/><text x="32" y="137" fill="#f8fafc" font-size="16">Player 4</text><text x="0" y="202" fill="#94a3b8" font-size="13">Corners: 2</text><text x="0" y="226" fill="#94a3b8" font-size="13">Edges: 3</text><text x="0" y="250" fill="#94a3b8" font-size="13">Interior: 4</text></g>
<text x="64" y="430" fill="#94a3b8" font-family="Inter,Arial" font-size="13">Illustrative asset · not a live game screenshot</text></svg>