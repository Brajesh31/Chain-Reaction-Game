name: Documentation and Repository Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Markdown links
        run: python scripts/validate_docs.py
      - name: Validate repository hygiene
        run: python scripts/validate_repository.py
      - name: Validate generated project structure
        run: python scripts/check_project_structure.py --check
      - name: Validate SVG assets
        run: python scripts/validate_svg.py
