name: 💥 Gameplay rule defect
description: Report an incorrect move, burst, capture, turn or winner result.
title: "[Gameplay]: "
labels: ["bug", "gameplay"]
body:
  - type: textarea
    id: board
    attributes:
      label: Starting board
      description: Include dimensions and relevant cell owner/count values.
    validations:
      required: true
  - type: textarea
    id: moves
    attributes:
      label: Exact move sequence
      description: Include player number and row/column for each move.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected final board
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Commit, browser and device
    validations:
      required: true
